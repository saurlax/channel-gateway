name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --locked
      - run: make check-python test
      - run: make package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: make check-web build-web
      - run: pnpm --dir frontend --filter @channel-gateway/console test

  container:
    name: Publish GHCR image
    needs: [python, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container startup and bundled console
        env:
          IMAGE_METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          image=$(jq -r '.tags[0]' <<< "$IMAGE_METADATA")
          container=$(docker run --detach --publish 127.0.0.1:18080:8080 \
            --env CG_ADMIN_USERNAME=smoke \
            --env CG_ADMIN_PASSWORD=container-smoke-test-password \
            "$image")
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 1 --retry-max-time 30 --max-time 3 http://127.0.0.1:18080/healthz
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q '<html'
          curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-Channel-Gateway-Request: 1' \
            --data '{"username":"smoke","password":"container-smoke-test-password"}' \
            http://127.0.0.1:18080/api/v1/auth/login > /dev/null
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish runtime image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record published image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published image tags:\n%s\n\nDigest: `%s`\n' "$IMAGE_TAGS" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
