[project]
name = "channel-gateway-core"
version = "0.0.0"
description = "Reusable communication models for Channel Gateway"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Saurlax" }]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.urls]
Homepage = "https://github.com/saurlax/channel-gateway"
Issues = "https://github.com/saurlax/channel-gateway/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["channel_gateway_core"]
